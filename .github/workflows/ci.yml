name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    tags-ignore:
      - 'v*'

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: [22.22.2, 24, 26]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.34.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm run build

      - name: Compatibility regression tests
        run: pnpm test

  smoke:
    name: smoke / ${{ matrix.package }}
    runs-on: ubuntu-latest
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        package:
          - eslint
          - prettier
          - commitlint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.34.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages
        run: pnpm run build

      - name: Run smoke check
        run: pnpm run smoke:${{ matrix.package }}
